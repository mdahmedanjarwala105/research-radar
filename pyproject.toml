[project]
name = "research-radar"
version = "0.1.0"
description = "Agentic RAG over the latest AI research papers, fully local"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "ollama>=0.6.3",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "qdrant-client[fastembed]>=1.20.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]
